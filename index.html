
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miniChatbot</title>
</head>
<body>

    <h2>miniChatbot</h2>

    <!-- Khung hội thoại -->
    <div id="chat" style="
        height: 300px;
        overflow-y: auto;
        overflow-x: hidden;
        border: 1px solid #aaa;
        padding: 10px;
        overflow-wrap: anywhere;
    "></div>

    <input
        id="message"
        type="text"
        placeholder="Nhập tin nhắn..."
    >

    <button id="send">Gửi</button>

    <hr>

    <button id="download">Tải bộ nhớ JSON</button>

    <input
        type="file"
        id="upload"
        accept=".json,application/json"
    >

    <h3>Chatbot Learning Data</h3>

    <!-- Khung dữ liệu học -->
    <pre id="debug" style="
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #aaa;
        padding: 10px;
    "></pre>

    <script src="./script.js"></script>

</body>
</html>
