<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Local Chatbot (Embedding + Markov)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-box { height: 350px; border: 1px solid #ddd; border-radius: 6px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
        .user { background: #0084ff; color: white; align-self: flex-end; }
        .bot { background: #e4e6eb; color: black; align-self: flex-start; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #006edc; }
        .status { font-size: 12px; color: #666; margin-bottom: 8px; font-style: italic; }
    </style>
</head>
<body>

<div class="chat-container">
    <h3>AI Local Chatbot</h3>
    <div class="status" id="statusText">Đang khởi tạo hệ thống...</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." disabled onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()" disabled>Gửi</button>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    let embedder = null;
    let embeddedKnowledge = [];

    // --- 1. THUẬT TOÁN MARKOV CHAIN (XÀO NẤU CÂU MỚI) ---
    function generateMarkovResponse(corpusSentences) {
        let markovMap = {};
        
        corpusSentences.forEach(sentence => {
            let words = sentence.split(" ");
            for (let i = 0; i < words.length - 1; i++) {
                let currentWord = words[i];
                let nextWord = words[i + 1];
                if (!markovMap[currentWord]) {
                    markovMap[currentWord] = [];
                }
                markovMap[currentWord].push(nextWord);
            }
        });

        let keys = Object.keys(markovMap);
        if (keys.length === 0) return null;

        let currentWord = keys[Math.floor(Math.random() * keys.length)];
        let result = [currentWord];
        let maxLength = 15;

        for (let i = 0; i < maxLength; i++) {
            let nextOptions = markovMap[currentWord];
            if (!nextOptions || nextOptions.length === 0) break;
            let nextWord = nextOptions[Math.floor(Math.random() * nextOptions.length)];
            result.push(nextWord);
            currentWord = nextWord;
            
            if (nextWord.includes(".") || nextWord.includes("!") || nextWord.includes("?")) break;
        }

        let generatedText = result.join(" ");
        return generatedText.charAt(0).toUpperCase() + generatedText.slice(1);
    }

    // --- 2. KHỞI TẠO AI VÀ LƯU CACHE (LOCALSTORAGE) ---
    async function initAI() {
        try {
            document.getElementById("statusText").innerText = "Đang tải mô hình AI...";
            embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');

            let response = await fetch('data.json');
            if (!response.ok) throw new Error("Không thể đọc file data.json");
            let jsonData = await response.json();
            let knowledgeBase = jsonData.responses;

            let cacheKey = "embedded_knowledge_v1_" + knowledgeBase.length;
            let cachedData = localStorage.getItem(cacheKey);

            if (cachedData) {
                document.getElementById("statusText").innerText = "Đang tải dữ liệu từ bộ nhớ đệm...";
                embeddedKnowledge = JSON.parse(cachedData);
            } else {
                document.getElementById("statusText").innerText = "Đang vector hóa dữ liệu (" + knowledgeBase.length + " câu)...";
                
                for (let text of knowledgeBase) {
                    let output = await embedder(text, { pooling: 'mean', normalize: true });
                    embeddedKnowledge.push({
                        text: text,
                        vector: Array.from(output.data)
                    });
                }
                localStorage.setItem(cacheKey, JSON.stringify(embeddedKnowledge));
            }

            document.getElementById("statusText").innerText = "AI đã sẵn sàng!";
            document.getElementById("userInput").disabled = false;
            document.getElementById("sendBtn").disabled = false;
            appendMessage("Bot: Chào bạn, hệ thống đã sẵn sàng!", "bot");

        } catch (error) {
            document.getElementById("statusText").innerText = "Lỗi: " + error.message;
            console.error(error);
        }
    }

    initAI();

    function cosineSimilarity(vecA, vecB) {
        let dotProduct = 0, normA = 0, normB = 0;
        for (let i = 0; i < vecA.length; i++) {
            dotProduct += vecA[i] * vecB[i];
            normA += vecA[i] * vecA[i];
            normB += vecB[i] * vecB[i];
        }
        if (normA === 0 || normB === 0) return 0.0;
        return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    // --- 3. XỬ LÝ GỬI TIN NHẮN & KẾT HỢP DỰ ĐOÁN ---
    window.sendMessage = async function() {
        let input = document.getElementById("userInput");
        let text = input.value.trim();
        if (!text || !embedder) return;

        appendMessage("Bạn: " + text, "user");
        input.value = "";

        let userOutput = await embedder(text, { pooling: 'mean', normalize: true });
        let userVector = Array.from(userOutput.data);

        let scoredList = [];
        for (let item of embeddedKnowledge) {
            let score = cosineSimilarity(userVector, item.vector);
            scoredList.push({ text: item.text, score: score });
        }

        scoredList.sort((a, b) => b.score - a.score);

        // Lấy Top 5 câu liên quan nhất
        let topMatches = scoredList.slice(0, 5);

        if (topMatches.length === 0 || topMatches[0].score < 0.2) {
            setTimeout(() => {
                appendMessage("Bot: Tôi chưa hiểu rõ ý bạn lắm.", "bot");
            }, 200);
            return;
        }

        // Tạo nguồn dữ liệu từ Top 5 câu liên quan để Markov xào nấu
        let corpus = topMatches.map(item => item.text);
        let markovReply = generateMarkovResponse(corpus);

        // Nếu Markov tạo ra câu hợp lệ thì dùng, không thì lấy câu có điểm cao nhất
        let finalReply = (markovReply && markovReply.length > 3) ? markovReply : topMatches[0].text;

        setTimeout(() => {
            appendMessage("Bot: " + finalReply, "bot");
        }, 200);
    }

    window.handleKeyPress = function(e) {
        if (e.key === "Enter") window.sendMessage();
    }

    function appendMessage(text, sender) {
        let chatBox = document.getElementById("chatBox");
        let div = document.createElement("div");
        div.className = "message " + sender;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
