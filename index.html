<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Key-Value</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 3px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 3px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #764ba2;
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        .error {
            color: #e74c3c;
            font-weight: 600;
        }

        .success {
            color: #27ae60;
            font-weight: 600;
        }

        .info-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Chatbot Key-Value</h1>
            <p>Nhập key để lấy value, hoặc random nếu không hợp lệ</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="empty-state">
                👋 Xin chào! Nhập một key để bắt đầu...
            </div>
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Nhập key (ví dụ: hello, cat, apple...)" 
                autocomplete="off"
            >
            <button id="sendBtn">Gửi</button>
        </div>
    </div>

    <script>
        // Data - Lưu trữ key-value pairs
        const keyValueData = {
            "hello": "xin chào",
            "world": "thế giới",
            "cat": "mèo",
            "dog": "chó",
            "apple": "táo",
            "orange": "cam",
            "good": "tốt",
            "bad": "xấu",
            "happy": "vui",
            "sad": "buồn",
            "water": "nước",
            "fire": "lửa",
            "earth": "đất",
            "air": "không khí",
            "sun": "mặt trời",
            "moon": "mặt trăng",
            "star": "ngôi sao",
            "night": "đêm",
            "day": "ngày",
            "food": "thức ăn"
        };

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Lấy random value từ data
        function getRandomValue() {
            const values = Object.values(keyValueData);
            return values[Math.floor(Math.random() * values.length)];
        }

        // Kiểm tra key và trả về value
        function processKey(key) {
            const trimmedKey = key.trim().toLowerCase();

            if (trimmedKey === '') {
                return {
                    valid: false,
                    value: "Vui lòng nhập một key!",
                    type: "empty"
                };
            }

            if (keyValueData.hasOwnProperty(trimmedKey)) {
                return {
                    valid: true,
                    value: keyValueData[trimmedKey],
                    type: "found"
                };
            } else {
                return {
                    valid: false,
                    value: getRandomValue(),
                    type: "notfound"
                };
            }
        }

        // Hiển thị tin nhắn
        function displayMessage(text, isUser, resultType = null) {
            if (chatBox.innerHTML.includes('👋')) {
                chatBox.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (isUser) {
                contentDiv.textContent = text;
            } else {
                contentDiv.innerHTML = text;
            }

            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Xử lý gửi tin nhắn
        function sendMessage() {
            const inputValue = userInput.value;

            if (inputValue.trim() === '') return;

            // Hiển thị tin nhắn của user
            displayMessage(inputValue, true);

            // Xử lý key
            const result = processKey(inputValue);

            // Tạo phản hồi từ bot
            let botResponse = '';
            if (result.type === 'found') {
                botResponse = `<span class="success">✓ Tìm thấy!</span><br>Key: <strong>${inputValue.trim().toLowerCase()}</strong><br>Value: <strong>${result.value}</strong><br><span class="info-text">Đây là giá trị chính xác từ database</span>`;
            } else if (result.type === 'notfound') {
                botResponse = `<span class="error">✗ Key không tồn tại!</span><br>Key: <strong>${inputValue.trim().toLowerCase()}</strong><br>Random Value: <strong>${result.value}</strong><br><span class="info-text">Key không hợp lệ, đã random 1 value</span>`;
            } else if (result.type === 'empty') {
                botResponse = `<span class="error">⚠ ${result.value}</span>`;
            }

            // Hiển thị phản hồi sau 500ms
            setTimeout(() => {
                displayMessage(botResponse, false, result.type);
            }, 500);

            userInput.value = '';
            userInput.focus();
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        userInput.focus();
    </script>
</body>
</html>
