<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot JSON-driven</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        .chat-header { 
            background: #0084ff; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-size: 18px; 
            font-weight: bold; 
        }
        .chat-container { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .message { 
            max-width: 75%; 
            padding: 10px 15px; 
            border-radius: 15px; 
            line-height: 1.4; 
            word-wrap: break-word; 
        }
        .message.user { 
            background: #0084ff; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 3px; 
        }
        .message.bot { 
            background: #e4e6eb; 
            color: black; 
            align-self: flex-start; 
            border-bottom-left-radius: 3px; 
        }
        .chat-input-area { 
            display: flex; 
            padding: 10px; 
            background: white; 
            border-top: 1px solid #ddd; 
        }
        .chat-input-area input { 
            flex: 1; 
            padding: 10px 15px; 
            border: 1px solid #ddd; 
            border-radius: 20px; 
            outline: none; 
            font-size: 14px; 
        }
        .chat-input-area button { 
            background: #0084ff; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            margin-left: 8px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .chat-input-area button:hover { 
            background: #006edd; 
        }
    </style>
</head>
<body>

    <div class="chat-header">SimpleBot Assistant</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message bot">Xin chào! Đang tải dữ liệu từ data.json...</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn của bạn..." autocomplete="off">
        <button id="sendBtn">Gửi</button>
    </div>

    <script>
        let chatbotData = null;
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Hàm tải file data.json bất đồng bộ
        async function loadChatbotData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Không thể tải file data.json');
                chatbotData = await response.json();
                
                chatContainer.innerHTML = '<div class="message bot">Xin chào! Tôi đã sẵn sàng trò chuyện cùng bạn.</div>';
            } catch (error) {
                console.warn('Lỗi CORS hoặc không tìm thấy file, chuyển sang dùng dữ liệu dự phòng:', error);
                
                chatbotData = {
                    "intents": [
                        {
                            "patterns": ["chào", "hi", "hello"],
                            "responses": [
                                "Chào bạn! (Chế độ dự phòng do chưa chạy qua Local Server).",
                                "Hãy chạy qua Local Server để nạp file data.json đầy đủ nhé!"
                            ]
                        }
                    ]
                };
                
                chatContainer.innerHTML = '<div class="message bot">⚠️ Đang chạy ở chế độ dự phòng. Hãy dùng Local Server để load data.json chuẩn xác!</div>';
            }
        }

        loadChatbotData();

        function appendMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleUserMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            setTimeout(() => {
                const botReply = findBotResponse(text);
                appendMessage('bot', botReply);
            }, 300);
        }

        function findBotResponse(input) {
            if (!chatbotData || !chatbotData.intents) return "Hệ thống đang khởi tạo dữ liệu, vui lòng đợi giây lát...";

            const lowerInput = input.toLowerCase();
            
            // 1. Kiểm tra khớp các patterns trong intents
            for (let item of chatbotData.intents) {
                for (let pattern of item.patterns) {
                    if (lowerInput.includes(pattern.toLowerCase())) {
                        const responses = item.responses;
                        return responses[Math.floor(Math.random() * responses.length)];
                    }
                }
            }

            // 2. Không khớp key nào -> Gom toàn bộ các giá trị responses từ mọi intent trong file
            let allResponses = [];
            for (let item of chatbotData.intents) {
                if (item.responses && Array.isArray(item.responses)) {
                    allResponses = allResponses.concat(item.responses);
                }
            }

            if (allResponses.length === 0) {
                return "Xin lỗi, tôi chưa hiểu ý bạn.";
            }

            // Random ngẫu nhiên 1 value bất kỳ trong toàn bộ kho responses
            return allResponses[Math.floor(Math.random() * allResponses.length)];
        }

        sendBtn.addEventListener('click', handleUserMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleUserMessage();
            }
        });
    </script>
</body>
</html>
