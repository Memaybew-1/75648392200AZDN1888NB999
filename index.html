<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Local Chatbot - Final Fix</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-box { height: 350px; border: 1px solid #ddd; border-radius: 6px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
        .user { background: #0084ff; color: white; align-self: flex-end; }
        .bot { background: #e4e6eb; color: black; align-self: flex-start; }
        .typing { font-style: italic; color: #666; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #006edc; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { font-size: 12px; color: #666; margin-bottom: 8px; font-style: italic; }
    </style>
</head>
<body>

<div class="chat-container">
    <h3>AI Local Chatbot</h3>
    <div class="status" id="statusText">Đang khởi tạo hệ thống...</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." disabled onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()" disabled>Gửi</button>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';
    import { loadChatHistory, saveMessageRecord, updateRecentQueries } from './ui.js';
    import { cosineSimilarity, extractPivotWords, generatePivotMarkovResponse, loadPrecomputedEmbeddings, scanEmbeddingRegion } from './ai.js';

    let embedder = null;
    let embeddedKnowledge = [];
    const chatBox = document.getElementById("chatBox");

    async function initSystem() {
        try {
            document.getElementById("statusText").innerText = "Đang tải mô hình AI...";
            embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');

            // THỰC THI: Đọc embeddings có sẵn trước
            document.getElementById("statusText").innerText = "Đang kiểm tra dữ liệu embeddings...";
            embeddedKnowledge = await loadPrecomputedEmbeddings();

            if (!embeddedKnowledge || embeddedKnowledge.length === 0) {
                let response = await fetch('data.json');
                if (!response.ok) throw new Error("Không thể đọc file data.json");
                let jsonData = await response.json();
                let knowledgeBase = jsonData.responses;

                document.getElementById("statusText").innerText = "Đang vector hóa tri thức (" + knowledgeBase.length + " câu)...";
                
                embeddedKnowledge = [];
                for (let text of knowledgeBase) {
                    let output = await embedder(text, { pooling: 'mean', normalize: true });
                    embeddedKnowledge.push({ text: text, vector: Array.from(output.data) });
                }
            } else {
                document.getElementById("statusText").innerText = "Đã tải xong embeddings từ bộ nhớ đệm (" + embeddedKnowledge.length + " câu)...";
            }

            document.getElementById("statusText").innerText = "AI sẵn sàng!";
            document.getElementById("userInput").disabled = false;
            document.getElementById("sendBtn").disabled = false;

            loadChatHistory(chatBox);
            if (chatBox.children.length === 0) {
                saveMessageRecord(chatBox, "Bot: Chào bạn, tôi đã sẵn sàng!", "bot");
            }

        } catch (error) {
            document.getElementById("statusText").innerText = "Lỗi khởi tạo: " + error.message;
            console.error(error);
        }
    }

    initSystem();

    window.sendMessage = async function() {
        let input = document.getElementById("userInput");
        let sendBtn = document.getElementById("sendBtn");
        let userText = input.value.trim();
        if (!userText || !embedder) return;

        saveMessageRecord(chatBox, "Bạn: " + userText, "user");
        input.value = "";
        input.disabled = true;
        sendBtn.disabled = true;

        let typingDiv = saveMessageRecord(chatBox, "Bot: Đang suy nghĩ...", "bot typing");

        try {
            let userOutput = await embedder(userText, { pooling: 'mean', normalize: true });
            let userVector = Array.from(userOutput.data);

            // THỰC THI: Sử dụng cơ chế quét vùng (Region Scanning) thay vì duyệt toàn cục thô
            let candidates = scanEmbeddingRegion(userVector, embeddedKnowledge, 0.15, 15);

            let finalReply = "Tôi chưa hiểu ý bạn lắm.";

            if (candidates.length > 0) {
                let shuffled = [...candidates].sort(() => 0.5 - Math.random());
                let topMatches = shuffled.slice(0, 5);

                let recentList = updateRecentQueries(userText);
                let combinedText = recentList.join(" ") + " " + userText;
                let pivotWords = extractPivotWords(combinedText);
                
                let corpus = topMatches.map(item => item.text);
                let markovReply = generatePivotMarkovResponse(corpus, pivotWords);
                
                finalReply = markovReply || candidates[0].text;
            } else {
                updateRecentQueries(userText);
            }

            chatBox.removeChild(typingDiv);
            saveMessageRecord(chatBox, "Bot: " + finalReply, "bot");

        } catch (err) {
            console.error("Lỗi khi xử lý tin nhắn:", err);
            if (typingDiv && typingDiv.parentNode) {
                chatBox.removeChild(typingDiv);
            }
            saveMessageRecord(chatBox, "Bot: Đã xảy ra lỗi nhỏ, bạn thử lại nhé!", "bot");
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    window.handleKeyPress = (e) => { if (e.key === "Enter") window.sendMessage(); };
</script>


</body>
</html>
