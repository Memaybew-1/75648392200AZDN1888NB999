name: Build Android APK from ZIP

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "No ZIP file found in repository."
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "${PROJECT_DIR:-}" ] && [ -f "$PROJECT_DIR/gradlew" ]; then
            cp -a "$PROJECT_DIR"/. .
          elif [ -f "extracted_project/gradlew" ]; then
            cp -a extracted_project/. .
          else
            echo "Android project not found inside ZIP"
            find extracted_project -maxdepth 3 | head -n 50
            exit 1
          fi

          rm -rf extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found. Please check ZIP structure."
            find . -maxdepth 3 -name gradlew -print
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
